<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Входящие заявки</title>
  <style>
    body { max-width: 40rem; margin: 2rem auto; padding: 0 1rem; font: 1rem/1.5 system-ui, sans-serif; }
    textarea { box-sizing: border-box; display: block; width: 100%; margin: .5rem 0; padding: .5rem; font: inherit; }
    button { padding: .4rem .8rem; font: inherit; }
    #status { margin: 1rem 0 .5rem; font-weight: 600; }
    #status[data-kind="manual_review"], #status[data-kind="service_unavailable"], #status[data-kind="invalid_input"] { color: #b42318; }
    #draft-block[hidden] { display: none; }
  </style>
</head>
<body>
  <h1>Входящие заявки</h1>
  <form novalidate>
    <label for="message">Текст заявки</label>
    <textarea id="message" rows="4"></textarea>
    <button type="submit">Разобрать заявку</button>
  </form>
  <p id="status" role="status" aria-live="polite"></p>
  <div id="draft-block" hidden>
    <label for="draft">Черновик ответа — проверьте перед отправкой клиенту</label>
    <textarea id="draft" rows="5"></textarea>
  </div>
  <script type="module">
    import { viewFor, MESSAGES } from "/view.mjs";

    const form = document.querySelector("form");
    const message = document.querySelector("#message");
    const status = document.querySelector("#status");
    const draftBlock = document.querySelector("#draft-block");
    const draft = document.querySelector("#draft");

    let lastRequestId = 0;
    let controller = null;

    function render({ kind, message: text, draft: draftText }) {
      status.dataset.kind = kind;
      status.textContent = text;
      draft.value = draftText;
      draftBlock.hidden = kind !== "ready";
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      // Новый запрос отменяет предыдущий; ответ устаревшего запроса не попадёт на экран.
      controller?.abort();
      controller = new AbortController();
      const requestId = ++lastRequestId;

      // Предыдущий черновик убираем сразу, чтобы менеджер не принял его за ответ на новую заявку.
      if (!message.value.trim()) return render(viewFor(400, { status: "invalid_input" }));
      render({ kind: "loading", message: MESSAGES.loading, draft: "" });

      let httpStatus = 0;
      let body = null;
      try {
        const reply = await fetch("/api/triage", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: message.value }),
          signal: controller.signal,
        });
        httpStatus = reply.status;
        body = await reply.json().catch(() => null);
      } catch (error) {
        if (error.name === "AbortError") return;
      }
      if (requestId !== lastRequestId) return;
      render(viewFor(httpStatus, body));
    });
  </script>
</body>
</html>
